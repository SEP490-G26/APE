<section id="embedding-tab" class="tab-panel">
  <div class="function-layout">
    <section class="panel">
      <div class="panel-head">
        <div>
          <p class="panel-kicker">Function 3</p>
          <h3>AI Embedding + Auto Tagging</h3>
        </div>
      </div>
      <form id="embedding-form" class="stack-form">
        <div class="grid grid--3">
          <label>User ID
            <input name="userId" value="prototype-user">
          </label>
          <label>Subject
            <select name="subject">
              <option value="C">C</option>
              <option value="JAVA_OOP">JAVA_OOP</option>
              <option value="DSA_JAVA">DSA_JAVA</option>
            </select>
          </label>
          <label>Language
            <select name="language">
              <option value="vi">vi</option>
              <option value="en">en</option>
            </select>
          </label>
          <label>Mode
            <select name="mode">
              <option value="TextOnly">TextOnly</option>
              <option value="FullMultimodalPage">FullMultimodalPage</option>
            </select>
          </label>
          <label>Embedding provider
            <select name="embeddingProvider" data-provider-select data-model-target="embedding-model"></select>
          </label>
          <label>Embedding model
            <select id="embedding-model" name="embeddingModel"></select>
          </label>
          <label>Tagging provider
            <select name="taggingProvider" data-provider-select data-model-target="tagging-model"></select>
          </label>
          <label>Tagging model
            <select id="tagging-model" name="taggingModel"></select>
          </label>
          <label>File name
            <input name="fileName" value="input.txt">
          </label>
        </div>
        <label>Upload file
          <input id="embedding-upload" type="file" accept=".txt,.md,.json,.pdf,.docx,.pptx,.png,.jpg,.jpeg,.webp">
        </label>
        <label>Allowed tags (comma separated)
          <textarea name="allowedTags" rows="3">array, pointer, loop, condition, class, object, inheritance, recursion, sorting, tree, linked-list, stack, queue</textarea>
        </label>
        <label>Content
          <textarea name="content" rows="16"></textarea>
        </label>
        <div class="action-row">
          <button type="submit">Run Embedding + Tagging</button>
          <button type="button" class="secondary" data-run-debug="embedding">Run Debug</button>
          <button type="button" class="secondary" data-copy-json="embedding">Copy JSON</button>
          <button type="button" class="secondary" data-export-json="embedding">Export JSON</button>
          <button type="button" class="secondary" id="embedding-export-chunks">Export Chunks JSON</button>
        </div>
      </form>
    </section>

    <section class="panel panel--output">
      <div class="panel-head">
        <div>
          <p class="panel-kicker">Output</p>
          <h3>Parsed result</h3>
        </div>
      </div>
      <div id="embedding-result" class="result-card"></div>
      <details class="details-block">
        <summary>Raw JSON</summary>
        <pre id="embedding-json" class="json-view"></pre>
      </details>
    </section>
  </div>
</section>
